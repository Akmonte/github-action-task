name: Task 2

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Крок для завантаження коду репозиторію на віртуальну машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Крок для встановлення Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. Install dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2. Run the tests with pytest and fail the workflow if coverage is below 70%
      - name: Run tests with coverage
        run: pytest --cov=myapp --cov-fail-under=70 --cov-report=html

      # 3. Upload a coverage report as an artifact for inspection
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        # if: always() гарантує, що звіт завантажиться навіть якщо тести впадуть
        if: always() 
        with:
          name: coverage-report
          path: coverage.html